name: zabira_academy
description: "Zabira Academy — Official Mobile Learning Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.9

  # ── State Management ────────────────────────────────────────────────────────
  provider: ^6.1.5

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^15.1.3

  # ── Fonts ───────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Local Storage ───────────────────────────────────────────────────────────
  shared_preferences: ^2.5.3

  # ── Icons & SVG ─────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17

  # ── Networking ──────────────────────────────────────────────────────────────
  http: ^1.2.2

  # ── Google Sign-In ──────────────────────────────────────────────────────────
  google_sign_in: ^6.2.2
  audioplayers: ^6.8.1
  record: ^5.2.1
  url_launcher: ^6.3.2
  razorpay_flutter: ^1.4.4
  flutter_cashfree_pg_sdk: ^2.4.0+52
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # ── Branding ───────────────────────────────────────────────────────────────
    - assets/images/branding/

    # ── Home — Hero Banners ────────────────────────────────────────────────────
    - assets/images/home/hero/

    # ── Home — Course Thumbnails ───────────────────────────────────────────────
    - assets/images/home/courses/quran_tajweed.png
    - assets/images/home/courses/understand_quran.png
    - assets/images/home/courses/namaz_dua.png
    - assets/images/home/courses/muslim_life.png

    # ── Home — Latest Launches ─────────────────────────────────────────────────
    - assets/images/home/latest_launches/

    # ── Home — Daily Supplement & Banner ───────────────────────────────────────
    - assets/images/home/daily_supplement/

    # ── Home — Category Icons (Zabira Academy custom PNGs) ────────────────────
    - assets/images/home/categories/
    - assets/images/home/icons/

    # ── Home — Zabira Store Products ──────────────────────────────────────────
    - assets/images/home/store/

    # ── Home — Footer / Bottom Nav Logo ───────────────────────────────────────
    - assets/images/home/footer/academy_footer_logo.png
